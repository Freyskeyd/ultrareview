[package]
name = "open-ultrareview-bridge"
version = "0.1.0"
edition = "2021"
description = "Bridge AI code findings to editor diagnostics via MCP + LSP"
license = "MIT"

[dependencies]
tower-lsp = "0.20"
lsp-types = "0.97"
rmcp = { version = "1.5.0", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
thiserror = "2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
