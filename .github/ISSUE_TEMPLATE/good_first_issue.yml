name: Good first issue
description: Maintainer template for scoped starter work.
title: "good first issue: "
labels: [good first issue, help wanted]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the small, self-contained change.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely involved
      description: List paths contributors should inspect first.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List concrete acceptance criteria.
      value: |
        -
        -
        -
    validations:
      required: true
